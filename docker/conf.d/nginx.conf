server {
    listen 80;
    index index.php index.html;
    root /var/www/public;

    # 1. Security: Hide Nginx version
    server_tokens off;

    # 2. Performance: Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # 3. Handle large uploads (already had this, which is good)
    client_max_body_size 100M;

    # 4. Security Headers (PCI-DSS Best Practice)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 5. Optimized PHP block
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        
        # Use the standard params
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Ensure HTTPS status is passed to Laravel correctly
        fastcgi_param HTTPS $https if_not_empty;

        # 6. Timeouts (Your current fix - keep these!)
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
        fastcgi_connect_timeout 600;

        # 7. Performance: Buffer settings
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # 8. Deny access to sensitive files (Standard practice)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}